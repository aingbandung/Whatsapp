name: Android APK

# Builds the Android app in this repo (a Capacitor shell that opens your OpenWA dashboard).
#  - push to main                     -> debug APK as a workflow artifact
#  - manual run (Actions tab)         -> choose debug/release and an optional default server URL
#  - tag  v1.2.3                      -> release build + GitHub Release with the APK attached

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        type: choice
        options: [debug, release]
        default: debug
      server_url:
        description: 'Default OpenWA server URL baked into the app (optional, e.g. https://wa.example.com)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # needed only to attach the APK to a GitHub Release on v* tags
    env:
      BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || (startsWith(github.ref, 'refs/tags/v') && 'release' || 'debug') }}
      DEFAULT_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.server_url || vars.OPENWA_DEFAULT_URL }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Bake default server URL (optional)
        if: env.DEFAULT_URL != ''
        run: |
          printf "window.OPENWA_DEFAULT_URL = %s;\n" "$(node -p 'JSON.stringify(process.env.DEFAULT_URL)')" > www/config.js
          cat www/config.js

      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Decode signing keystore (release, optional)
        if: env.BUILD_TYPE == 'release' && env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "$BUILD_TYPE" = "release" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          ./gradlew "$TASK" --no-daemon \
            -PVERSION_NAME="${{ steps.ver.outputs.name }}" \
            -PVERSION_CODE="${{ steps.ver.outputs.code }}"

      - name: Collect APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find android/app/build/outputs/apk -name '*.apk' -print -exec cp {} "$GITHUB_WORKSPACE/dist/" \;
          cd "$GITHUB_WORKSPACE/dist"
          for f in *.apk; do mv "$f" "OpenWA-${{ steps.ver.outputs.name }}-${f}"; done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: openwa-apk-${{ env.BUILD_TYPE }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
